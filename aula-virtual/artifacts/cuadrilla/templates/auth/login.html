{% extends "base.html" %}
{% block content_class %} narrow{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1 class="page-title">Ingresa al aula</h1>
  <p class="page-sub">Usa tu DNI y tu contraseña de DMC.</p>
    <form method="post" action="{{ url_for('login_post') }}" class="form">
    <label>DNI<input name="dni" inputmode="numeric" autocomplete="username" required maxlength="12" value="{{ dni or '' }}" autofocus></label>
    <label>Contraseña<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
    <button class="btn btn-block" type="submit">Ingresar</button>
  </form>
  {% if settings.PUBLIC_DEMO_LOGIN %}
  <div class="demo-login-action"><a class="btn btn-ghost btn-block" href="{{ url_for('demo_login') }}">Probar DEMO</a></div>
  {% endif %}
</div>
{% endblock %}
